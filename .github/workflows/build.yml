name: build-ios-llama-server

on:
  workflow_dispatch:
    inputs:
      llama_ref:
        description: 'llama.cpp git ref (branch/tag/sha)'
        required: false
        default: 'master'
      model_default:
        description: 'Default GGUF model path baked into launcher (optional)'
        required: false
        default: ''

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ github.event.inputs.llama_ref }}
          fetch-depth: 1

      - name: Patch out hardcoded install (iOS cross-build)
        run: |
          python3 - <<'PY'
          p = "tools/server/CMakeLists.txt"
          s = open(p).read()
          s = s.replace("install(TARGETS ${TARGET} RUNTIME)", "#install(TARGETS ${TARGET} RUNTIME) [patched-ios]")
          open(p, "w").write(s)
          print("patched" if "#install(TARGETS" in s else "FAILED")
          PY

      - name: Install deps
        run: brew install cmake ninja

      - name: Configure (iOS arm64, static, noMetal-needed-server)
        run: |
          mkdir -p build-ios
          cmake -G Ninja -B build-ios -S . \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_METAL=OFF \
            -DLLAMA_ACCELERATE=OFF \
            -DLLAMA_BLAS=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_INSTALL=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build llama-server
        run: cmake --build build-ios --target llama-server -j$(sysctl -n hw.ncpu)

      - name: Locate binary
        run: |
          BIN=$(find build-ios -name llama-server -type f | head -1)
          echo "BIN=$BIN" >> $GITHUB_ENV
          file "$BIN"

      - name: Strip + zip artifact
        run: |
          strip "$BIN" || true
          cd "$(dirname "$BIN")"
          zip -j llama-server-ios.zip llama-server
          echo "ART=$(pwd)/llama-server-ios.zip" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-ios
          path: ${{ env.ART }}
          retention-days: 30

